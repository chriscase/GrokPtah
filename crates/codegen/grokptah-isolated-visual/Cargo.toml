[package]
name = "grokptah-isolated-visual"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Host-owned isolated Computer Use guest/VM lifecycle (#288/#363)"
publish = false
rust-version = "1.80"

# Own workspace so this crate can be tested without compiling grokptah-agent-bridge.
[workspace]

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
fs2 = "0.4"
hmac = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "grokptah-isolated-visual-qualify"
path = "src/bin/qualify.rs"
