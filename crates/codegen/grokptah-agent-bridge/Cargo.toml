[package]
name = "grokptah-agent-bridge"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "In-process agent host for GrokPtah desktop (ACP-shaped sessions, streaming, permissions)"
authors = ["GrokPtah"]
build = "build.rs"

# Own workspace root (excluded from monorepo root Cargo.toml).
[workspace]

[dependencies]
anyhow = "1"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util", "process"] }
tokio-util = { version = "0.7", features = ["rt"] }
uuid = { version = "1", features = ["v4", "serde"] }
walkdir = "2"
regex = "1"
dirs = "6"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
bytes = "1"
sha2 = "0.10"
grokptah-agent-sdk = { path = "../../common/grokptah-agent-sdk" }

keyring = { version = "3", features = ["apple-native", "sync-secret-service", "windows-native"] }
open = "5"
fs2 = "0.4"
dunce = "1"
# #196: loopback MCP control transport (quarantined from monorepo rmcp stack)
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
tower = "0.5"
http-body-util = "0.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[build-dependencies]
cc = "1"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util", "process", "test-util"] }
tempfile = "3"
# Test-only: the adaptive Computer Use planner/executor contract, so its
# vocabulary can be asserted against this crate's safety kernel rather than
# drifting from it. Not a runtime dependency of the bridge.
grokptah-cu-adaptive = { path = "../../common/grokptah-cu-adaptive" }
