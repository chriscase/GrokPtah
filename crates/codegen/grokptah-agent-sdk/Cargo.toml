[package]
name = "grokptah-agent-sdk"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Versioned, provider-neutral capability boundary for embedding the GrokPtah agent runtime"
authors = ["GrokPtah"]

# Not published. ADR-002 §7 gates publication on a named compatibility owner
# maintaining the parity matrix for a real external consumer. Consumers depend
# on this crate by path or git revision until that gate is met.
publish = false

# Own workspace root, matching `grokptah-agent-bridge` and `grokptah-service`.
[workspace]

[dependencies]
async-trait = "0.1"
chrono = { version = "0.4.35", default-features = false, features = ["now", "serde", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = { version = "0.10", features = ["force-soft"] }
thiserror = "2"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[features]
default = ["fake", "conformance"]
# Deterministic in-memory adapter. Consumers keep this on for their own tests
# and may turn it off for a production-only dependency graph.
fake = []
# Adapter-agnostic contract battery. Any adapter that claims this contract runs
# it; it is the shared fixture matrix ADR-002 §7 step 3 requires.
conformance = []
