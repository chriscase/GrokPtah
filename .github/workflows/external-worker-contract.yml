name: External Worker Contract

# The external-worker contract crate is a path dependency of the bridge, so the
# desktop workflow compiles it but never runs its own tests. The published v1
# schema is not exercised by any job at all. This runs both, and runs the
# browser-safe parsers too, so a schema-only edit cannot drift from the Rust
# and TypeScript projections without a job going red.
on:
  push:
    branches:
      - main
    paths:
      - "crates/common/grokptah-agent-sdk/**"
      - "docs/schemas/grokptah-external-worker.v1.schema.json"
      - "docs/schemas/grokptah-external-worker.v1.conformance.json"
      - "desktop/src/lib/externalWorker.ts"
      - "desktop/src/lib/externalWorker.test.ts"
      - "desktop/src/lib/grokptahBrokerClient.ts"
      - "desktop/src/lib/grokptahBrokerClient.test.ts"
      - "desktop/src/lib/externalWorkerConformance.test.ts"
      - ".github/workflows/external-worker-contract.yml"
  pull_request:
    paths:
      - "crates/common/grokptah-agent-sdk/**"
      - "docs/schemas/grokptah-external-worker.v1.schema.json"
      - "docs/schemas/grokptah-external-worker.v1.conformance.json"
      - "desktop/src/lib/externalWorker.ts"
      - "desktop/src/lib/externalWorker.test.ts"
      - "desktop/src/lib/grokptahBrokerClient.ts"
      - "desktop/src/lib/grokptahBrokerClient.test.ts"
      - "desktop/src/lib/externalWorkerConformance.test.ts"
      - ".github/workflows/external-worker-contract.yml"

permissions:
  contents: read

concurrency:
  group: external-worker-contract-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_INCREMENTAL: "0"
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_GHA_RW_MODE: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'READ_ONLY' || 'READ_WRITE' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: "1.92.0"
          components: clippy
      - name: Configure compiler-cache namespace
        env:
          SCCACHE_NAMESPACE: grokptah-contract-v1-${{ runner.os }}-${{ runner.arch }}-rust-1.92-${{ hashFiles('Cargo.lock') }}
        run: echo "SCCACHE_GHA_VERSION=${SCCACHE_NAMESPACE}" >> "$GITHUB_ENV"
      - name: Install compiler cache
        uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10
        with:
          version: "v0.16.0"
      # `-p grokptah-agent-sdk` pulls in only serde, so this needs no protoc,
      # no dotslash launcher, and no system libraries.
      - name: Contract crate lint and tests
        run: |
          cargo clippy -p grokptah-agent-sdk --all-targets --locked -- -D warnings
          cargo test -p grokptah-agent-sdk --locked
      - name: Browser-safe projection tests
        working-directory: desktop
        run: |
          npm ci
          npx vitest run \
            src/lib/externalWorker.test.ts \
            src/lib/externalWorkerConformance.test.ts \
            src/lib/grokptahBrokerClient.test.ts
