[package]
license = "Apache-2.0"
edition.workspace = true
name = "xai-source-view"
version = "0.1.0"
description = "Read-only source inspection: authorization snapshots, handle-relative contained reads, and bounded range projections"

[dependencies]
blake3 = { workspace = true }
dunce = { workspace = true }
serde = { workspace = true }

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["fs"] }

[dev-dependencies]
jsonschema = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
