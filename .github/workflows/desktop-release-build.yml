name: Desktop Release Build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-release-build
  cancel-in-progress: false

jobs:
  unsigned-release:
    name: Unsigned macOS bundle
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      # Keep every restored cache private to this job's disposable runner.
      CARGO_HOME: ${{ runner.temp }}/grokptah-cargo-home
      CARGO_TARGET_DIR: ${{ runner.temp }}/grokptah-target
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: true

      - name: Verify clean reviewed checkout
        run: test -z "$(git status --porcelain)"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: "1.92.0"

      # Cargo registry/git sources and release fingerprints are untrusted
      # accelerators only. A miss restores the ordinary clean-clone build.
      - name: Restore release Cargo cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ${{ runner.temp }}/grokptah-cargo-home/registry
            ${{ runner.temp }}/grokptah-cargo-home/git
            ${{ runner.temp }}/grokptah-target
          key: grokptah-release-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'desktop/package-lock.json', 'desktop/src-tauri/Cargo.lock', 'crates/codegen/grokptah-agent-bridge/Cargo.lock', 'desktop/src-tauri/tauri.conf.json') }}

      - name: Install frontend dependencies
        working-directory: desktop
        run: npm ci

      - name: Build unsigned desktop bundle
        working-directory: desktop
        run: npm run tauri:build

      - name: Upload unsigned bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: grokptah-macos-unsigned-${{ github.sha }}
          path: ${{ runner.temp }}/grokptah-target/release/bundle
          if-no-files-found: error
          retention-days: 7
