[package]
name = "grokptah-certification-lab"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Black-box MCP certification and replay lab for GrokPtah persistent Agents"

[workspace]

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
dunce = "1"
fs2 = "0.4"
grokptah-agent-bridge = { path = "../../crates/codegen/grokptah-agent-bridge" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time"] }
uuid = { version = "1", features = ["v4", "serde"] }
