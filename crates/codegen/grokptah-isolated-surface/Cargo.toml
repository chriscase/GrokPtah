[package]
name = "grokptah-isolated-surface"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Synthetic Isolated Surface Proof Harness for Windowed Coding Run v0 (#288/#286)"
authors = ["GrokPtah"]

# Own workspace root (excluded from monorepo root and agent-bridge workspace).
[workspace]
resolver = "2"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3"
