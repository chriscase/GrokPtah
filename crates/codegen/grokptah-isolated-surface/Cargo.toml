[package]
name = "grokptah-isolated-surface"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Synthetic Isolated Surface Proof Harness for Windowed Coding Run v0 (#288/#286)"
authors = ["GrokPtah"]

[features]
default = []
# Mac-only Virtualization.framework backend stub; off by default on Linux CI.
vf-backend = []
# Optional native browser engine path; off by default — Linux CI uses simulator substrate.
browser-engine = []

# Own workspace root (excluded from monorepo root and agent-bridge workspace).
[workspace]
resolver = "2"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
libc = "0.2"
objc2 = "0.6.3"

[[bin]]
name = "grokptah-sep18-checklist"
path = "src/bin/grokptah-sep18-checklist.rs"

[dev-dependencies]
tempfile = "3"
