name: Hosted Service

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "crates/codegen/grokptah-service/**"
      - "crates/codegen/grokptah-agent-bridge/**"
      - "crates/codegen/grokptah-service/Cargo.lock"
      - "crates/codegen/grokptah-agent-bridge/Cargo.lock"
      - ".github/workflows/hosted-service.yml"
  pull_request:
    paths:
      - "crates/codegen/grokptah-service/**"
      - "crates/codegen/grokptah-agent-bridge/**"
      - "crates/codegen/grokptah-service/Cargo.lock"
      - "crates/codegen/grokptah-agent-bridge/Cargo.lock"
      - ".github/workflows/hosted-service.yml"

permissions:
  contents: read

concurrency:
  group: hosted-service-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  hosted-service:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: "0"
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_GHA_RW_MODE: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'READ_ONLY' || 'READ_WRITE' }}
    defaults:
      run:
        working-directory: crates/codegen/grokptah-service
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The shared black-box fixture re-derives the declared revision from
          # git, which needs the merge commit's parents and their history.
          fetch-depth: 0
      - name: Declare the source revision under test
        # A pull_request checkout is an ephemeral merge commit minted per run,
        # so it can never appear in the fixture's compile-time audited table.
        # The workflow states which revision it is certifying instead of
        # letting the fixture guess from whatever HEAD happens to be. This is
        # compile-time metadata: the fixture reads it with option_env! and then
        # verifies it against this checkout before any golden is selected, so
        # it cannot be used as a runtime override to claim an audited revision.
        working-directory: .
        env:
          DECLARED_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$DECLARED_REVISION" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "declared revision is not a full commit sha: $DECLARED_REVISION" >&2
            exit 1
          fi
          if ! git rev-parse --verify --quiet "$DECLARED_REVISION^{commit}" >/dev/null; then
            echo "declared revision $DECLARED_REVISION is absent from this checkout" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$DECLARED_REVISION" HEAD; then
            echo "declared revision $DECLARED_REVISION is not an ancestor of HEAD" >&2
            exit 1
          fi
          echo "GROKPTAH_SHARED_BLACK_BOX_SOURCE_REVISION=$DECLARED_REVISION" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: "1.92.0"
          components: rustfmt, clippy
      - name: Configure compiler-cache namespace
        env:
          SCCACHE_NAMESPACE: grokptah-service-v1-${{ runner.os }}-${{ runner.arch }}-rust-1.92-${{ hashFiles('crates/codegen/grokptah-service/Cargo.lock', 'crates/codegen/grokptah-agent-bridge/Cargo.lock') }}
        run: echo "SCCACHE_GHA_VERSION=${SCCACHE_NAMESPACE}" >> "$GITHUB_ENV"
      - name: Install compiler cache
        uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10
        with:
          version: "v0.16.0"
      - name: Install Linux keyring build deps
        # The bridge's keyring crate needs libdbus on Ubuntu. Desktop CI is
        # macOS and does not substitute for this hosted-service job.
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libdbus-1-dev pkg-config
      - name: Format, clippy, and complete hosted-service tests
        # Always run this crate's own suite. Compiling the bridge in another
        # workflow is not a substitute for hosted-service tests.
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked -- --test-threads=1
