[package]
name = "grokptah-headless-host"
description = "Runnable headless/CLI host seam for durable GrokPtah runs without the desktop app"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

# Nested workspace, same shape as grokptah-agent-bridge: this package is the
# workspace root and is not a member of the repository root workspace.
[workspace]
resolver = "2"

[features]
default = ["cli"]
# The `cli` feature carries the operator binary and its OS signal wiring. The
# library core stays synchronous and dependency-light without it.
cli = ["dep:clap", "dep:tokio"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"], optional = true }
tokio = { version = "1", features = ["rt", "macros", "signal"], optional = true }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "grokptah-headless"
path = "src/bin/grokptah_headless.rs"
required-features = ["cli"]

[lints.rust]
unsafe_code = "forbid"
