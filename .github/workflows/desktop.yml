name: Desktop

on:
  push:
    branches:
      - main
    paths:
      - "desktop/**"
      - "crates/codegen/grokptah-agent-bridge/**"
      - "crates/codegen/grokptah-isolated-visual/**"
      - "evals/**"
      - "scripts/check-adversarial-reachable.sh"
      - "scripts/check-committed-lockfiles.sh"
      - ".github/workflows/desktop.yml"
  pull_request:
    paths:
      - "desktop/**"
      - "crates/codegen/grokptah-agent-bridge/**"
      - "crates/codegen/grokptah-isolated-visual/**"
      - "evals/**"
      - "scripts/check-adversarial-reachable.sh"
      - "scripts/check-committed-lockfiles.sh"
      - ".github/workflows/desktop.yml"

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Preserve every main run; only superseded PR heads are safe to cancel.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  desktop:
    runs-on: macos-latest
    env:
      CARGO_INCREMENTAL: "0"
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_GHA_RW_MODE: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'READ_ONLY' || 'READ_WRITE' }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: "1.92.0"
          components: rustfmt, clippy
      - name: Configure compiler-cache namespace
        env:
          SCCACHE_NAMESPACE: grokptah-v1-${{ runner.os }}-${{ runner.arch }}-rust-1.92-${{ hashFiles('desktop/src-tauri/Cargo.lock', 'crates/codegen/grokptah-agent-bridge/Cargo.lock', 'crates/codegen/grokptah-isolated-visual/Cargo.lock', 'evals/certification-lab/Cargo.lock') }}
        run: echo "SCCACHE_GHA_VERSION=${SCCACHE_NAMESPACE}" >> "$GITHUB_ENV"
      - name: Install compiler cache
        uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10
        with:
          version: "v0.16.0"
      - name: Install frontend deps
        run: npm ci
      - name: Typecheck + unit tests
        run: |
          npm run typecheck
          npm test
      - name: Cargo tests (desktop)
        working-directory: desktop/src-tauri
        # cargo test compiles the library, binary, and test targets.
        run: cargo test --locked
      - name: Bridge fmt + clippy + tests
        # Bridge is its own Cargo workspace root (path dep of desktop).
        working-directory: crates/codegen/grokptah-agent-bridge
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          # Store tests use advisory file locks and must not overlap in-process.
          cargo test --locked -- --test-threads=1
          cargo fmt --manifest-path test-support/grokptah-test-gateway/Cargo.toml --all -- --check
          cargo clippy --manifest-path test-support/grokptah-test-gateway/Cargo.toml --locked --all-targets -- -D warnings
          cargo test --manifest-path test-support/grokptah-test-gateway/Cargo.toml --locked
      - name: Computer Use authority (isolated-visual crate)
        # This crate declares its own [workspace], so the bridge-wide
        # `cargo test` above compiles its library as a dependency but does NOT
        # run its unit tests or its adversarial matrix. They only execute when a
        # step targets this manifest, which is what this step is for.
        working-directory: crates/codegen/grokptah-isolated-visual
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets -- -D warnings
          # Store tests take advisory file locks and must not overlap.
          cargo test --locked -- --test-threads=1
      - name: Computer Use authority gates (repo root)
        working-directory: .
        run: |
          # Every committed lockfile still resolves from this exact tree.
          scripts/check-committed-lockfiles.sh
          # Every adversarial suite is actually reachable, and no second
          # helper-local lease/dispatch authority has reappeared.
          scripts/check-adversarial-reachable.sh
      - name: Packaged Computer Use identity inspection (no signing)
        working-directory: desktop
        # Inspects source topology only. It never signs, never opens the
        # Keychain, never prompts TCC, and treats a missing .app as
        # unavailable rather than as a pass.
        #
        # The ancestry regression runs first: CI checks out a shallow merge
        # ref, which is exactly the case where an unprovable ancestry must
        # report indeterminate rather than a definite "does not descend".
        run: |
          npm run qualify:ancestry-regression
          npm run qualify:computer-use-package
      - name: Offline parity oracles (no network)
        # Structured oracle unit tests + fixture selftests; live suite is on-demand.
        working-directory: crates/codegen/grokptah-agent-bridge
        run: cargo test --locked eval_oracle -- --nocapture
      - name: Persistent-Agent certification lab (offline only)
        working-directory: evals/certification-lab
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked -- --test-threads=1
          cargo run --locked -- validate-manifest --repository "$GITHUB_WORKSPACE"
          cargo run --locked -- replay --fixture "$GITHUB_WORKSPACE/evals/certification-lab/replay-fixtures/provider-behaviors.v1.json"
          cargo run --locked -- preflight --repository "$GITHUB_WORKSPACE" --output "$RUNNER_TEMP/grokptah-cert-output"
          cargo run --locked -- run --repository "$GITHUB_WORKSPACE" --output "$RUNNER_TEMP/grokptah-cert-output"
      - name: Offline oracle suite shape (repo root)
        working-directory: .
        run: |
          test -f evals/tasks.json
          test -f evals/oracle_selftest/pass_exact/artifact.txt
          test -f evals/oracle_selftest/fail_exact/artifact.txt
          python3 - <<'PY'
          import json
          from pathlib import Path
          tasks = json.loads(Path("evals/tasks.json").read_text())
          hard = [t for t in tasks if t.get("difficulty") != "smoke"]
          assert hard, "need hard discriminating tasks"
          for t in hard:
              ty = t["success"]["type"]
              assert ty in ("command", "all", "exact_file"), (t["id"], ty)
          print(f"ok: {len(tasks)} tasks, {len(hard)} hard, structured oracles")
          PY
